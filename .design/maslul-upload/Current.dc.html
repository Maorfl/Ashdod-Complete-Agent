<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Assistant', system-ui, sans-serif; background: #eceff3; direction: rtl; }
    a { color: #B07A2E; } a:hover { color: #8c6124; }
  </style>
</helmet>
<div style="padding: 28px; background: #eceff3;">

  <div style="font-size: 11px; font-weight: 700; letter-spacing: .06em; color: #8a94a3; margin-bottom: 12px;">היום במסך</div>

  <div style="background: #ffffff; border: 1px solid #d3dae3; border-radius: 10px; box-shadow: 0 1px 2px rgba(15,42,63,.06), 0 8px 24px rgba(15,42,63,.07); padding: 20px;">
    <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">

      <div style="min-width: 280px; margin-bottom: 14px;">
        <label style="display: block; font-size: 13px; font-weight: 700; color: #16384f; margin: 0 0 6px;">חשבון ספק (PDF) — חובה</label>
        <div style="width: 100%; font-family: 'Assistant', system-ui, sans-serif; font-size: 14px; color: #15212e; background: #ffffff; border: 1px solid #d3dae3; border-radius: 7px; padding: 9px 12px; display: flex; align-items: center; gap: 8px; direction: ltr; justify-content: flex-start;">
          <span style="background: linear-gradient(#f9f9f9, #e8e8e8); border: 1px solid #adadad; border-radius: 3px; padding: 3px 10px; font-size: 13px; color: #1a1a1a; font-family: system-ui, sans-serif;">Choose File</span>
          <span style="font-size: 13px; color: #4a4a4a; font-family: system-ui, sans-serif;">No file chosen</span>
        </div>
      </div>

      <button style="border: 1px solid #cfa25e; background: #d3ae78; color: #2a1c08; padding: 9px 16px; border-radius: 7px; font-weight: 700; font-size: 14px; font-family: 'Assistant', system-ui, sans-serif; box-shadow: 0 1px 2px rgba(176,122,46,.25); display: inline-flex; align-items: center; gap: 6px; opacity: .5;">נתח חשבון</button>

      <button style="border: 1px solid #d3dae3; background: #ffffff; color: #16384f; padding: 9px 16px; border-radius: 7px; font-weight: 700; font-size: 14px; font-family: 'Assistant', system-ui, sans-serif; display: inline-flex; align-items: center; gap: 6px; opacity: .5;">ניקוי</button>

    </div>
  </div>

  <div style="margin-top: 14px; font-size: 12.5px; color: #5d6b7d; line-height: 1.6;">
    כפתור הדפדפן מגיע באנגלית ובאפור משלו — לא מקבל את הגופן, הצבעים או הפינות של המערכת, ושובר את כיוון ה‑RTL.
  </div>

</div>
</x-dc>
</body>
</html>
